<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">SoHee Kim — Robotics, Embedded Systems, Intelligent Control</title>
<desc id="desc">A teal and violet engineering banner with an animated signal core, orbiting nodes, and circuit signals.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081222"/><stop offset="1" stop-color="#1d1642"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#35e6c1"/><stop offset="1" stop-color="#9d8cff"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8aa4c8" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<rect width="1200" height="300" rx="20" fill="url(#grid)"/>
<path d="M0 265 Q300 220 600 260 T1200 238 V300 H0Z" fill="#35e6c1" opacity=".06"><animate attributeName="d" values="M0 265 Q300 220 600 260 T1200 238 V300 H0Z;M0 250 Q300 275 600 245 T1200 265 V300 H0Z;M0 265 Q300 220 600 260 T1200 238 V300 H0Z" dur="8s" repeatCount="indefinite"/></path>
<g fill="none" stroke="#35e6c1" stroke-width="2" opacity=".35"><path d="M0 75H85L110 100H155M0 190H100L140 230H205M1020 52H1080L1100 72H1200M1010 242H1070L1100 212H1200"/>
<path d="M0 75H85L110 100H155M1010 242H1070L1100 212H1200" stroke="#ad9cff" stroke-width="3" stroke-dasharray="14 220"><animate attributeName="stroke-dashoffset" from="240" to="0" dur="3s" repeatCount="indefinite"/></path></g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="68" y="68" fill="#35e6c1" font-size="13" letter-spacing="4">BUILDING SYSTEMS THAT MOVE</text>
<text x="64" y="137" fill="#f5f8ff" font-size="62" font-weight="700">SoHee Kim</text>
<text x="68" y="179" fill="#c6d1eb" font-size="20">Robotics · Embedded Systems · Intelligent Control</text>
<text x="68" y="219" fill="#8fa3c9" font-size="15">INHA UNIVERSITY  /  MECHANICAL × ELECTRONICS × AI</text>
</g>
<g transform="translate(935 146)">
<circle r="108" fill="none" stroke="#35e6c1" stroke-opacity=".14"/>
<circle r="90" fill="none" stroke="#9d8cff" stroke-opacity=".4" stroke-dasharray="22 12 4 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="url(#accent)" stroke-width="2">
<ellipse rx="78" ry="32" transform="rotate(-32)"/>
<ellipse rx="78" ry="32" transform="rotate(32)"/>
<path d="M-72 0H-40M40 0H72M0 -72V-40M0 40V72"/>
<rect x="-34" y="-34" width="68" height="68" rx="12" fill="#112a3e"/>
<rect x="-23" y="-23" width="46" height="46" rx="7" stroke-opacity=".4"/>
<path d="M-20 5L-12 5L-6 -9L3 12L10 -3H20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g fill="#35e6c1"><circle cx="-72" r="5"/><circle cx="72" r="5"/><circle cy="-72" r="5"/><circle cy="72" r="5"/>
<animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></g>
<g><circle cx="78" r="4" fill="#b8aaff"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#b1bfdc" font-size="10" text-anchor="middle"><text y="-117">DESIGN</text><text y="130">CONTROL · INTELLIGENCE</text></g>
</g>
<rect x="68" y="252" width="210" height="3" rx="2" fill="url(#accent)"><animate attributeName="width" values="170;250;170" dur="5s" repeatCount="indefinite"/></rect>
</svg>
